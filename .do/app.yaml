alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: t7sen.com
    type: PRIMARY
  - domain: www.t7sen.com
    type: ALIAS
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: portfolio
      match:
        authority:
          exact: ""
        path:
          prefix: /
name: t7sen-portfolio
region: fra
services:
  - build_command: pnpm build
    environment_slug: node-js
    envs:
      - key: RESEND_API_KEY
        scope: RUN_AND_BUILD_TIME
        value: ${RESEND_API_KEY}
      - key: SENTRY_AUTH_TOKEN
        scope: RUN_AND_BUILD_TIME
        value: ${SENTRY_AUTH_TOKEN}
      - key: PORT
        scope: RUN_AND_BUILD_TIME
        value: "8080"
      - key: UPSTASH_REDIS_REST_TOKEN
        scope: RUN_AND_BUILD_TIME
        value: ${UPSTASH_REDIS_REST_TOKEN}
      - key: UPSTASH_REDIS_REST_URL
        scope: RUN_AND_BUILD_TIME
        value: ${UPSTASH_REDIS_REST_URL}
      - key: UPSTASH_REDIS_URL
        scope: RUN_AND_BUILD_TIME
        value: ${UPSTASH_REDIS_URL}
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: BETTER_AUTH_SECRET
        scope: RUN_AND_BUILD_TIME
        value: ${BETTER_AUTH_SECRET}
      - key: BETTER_AUTH_URL
        scope: RUN_AND_BUILD_TIME
        value: ${BETTER_AUTH_URL}
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_AND_BUILD_TIME
        value: ${NEXT_PUBLIC_APP_URL}
      - key: TURSO_DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${TURSO_DATABASE_URL}
      - key: TURSO_AUTH_TOKEN
        scope: RUN_AND_BUILD_TIME
        value: ${TURSO_AUTH_TOKEN}
      - key: GITHUB_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        value: ${GITHUB_CLIENT_ID}
      - key: GITHUB_CLIENT_SECRET
        scope: RUN_AND_BUILD_TIME
        value: ${GITHUB_CLIENT_SECRET}
      - key: DISCORD_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        value: ${DISCORD_CLIENT_ID}
      - key: DISCORD_CLIENT_SECRET
        scope: RUN_AND_BUILD_TIME
        value: ${DISCORD_CLIENT_SECRET}
      - key: GOOGLE_CLIENT_ID
        scope: RUN_AND_BUILD_TIME
        value: ${GOOGLE_CLIENT_ID}
      - key: GOOGLE_CLIENT_SECRET
        scope: RUN_AND_BUILD_TIME
        value: ${GOOGLE_CLIENT_SECRET}
      - key: ADMIN_EMAILS
        scope: RUN_AND_BUILD_TIME
        value: ${ADMIN_EMAILS}
    github:
      branch: main
      deploy_on_push: true
      repo: T7SEN/portfolio
    health_check:
      failure_threshold: 9
      http_path: /api/health
      period_seconds: 10
      success_threshold: 1
      timeout_seconds: 1
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    liveness_health_check:
      failure_threshold: 9
      http_path: /api/health
      period_seconds: 10
      success_threshold: 1
      timeout_seconds: 1
    name: portfolio
    run_command: pnpm start
    source_dir: /
